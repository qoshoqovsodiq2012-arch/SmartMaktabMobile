name: Build SmartMaktab APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
  run: |
    python3 -c "import zipfile; z=zipfile.ZipFile('SmartMaktab.zip'); z.extractall('.')"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          cd mobile
          flutter create . --platforms=android
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartMaktab-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
