
name: Build SmartMaktab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          import shutil

          with zipfile.ZipFile("SmartMaktab.zip") as z:
              for item in z.infolist():
                  name = item.filename.replace("\\", "/").strip("/")
                  if not name:
                      continue

                  if name == "mobile/android" or name.startswith("mobile/android/"):
                      continue

                  path = Path(name)
                  if item.is_dir():
                      path.mkdir(parents=True, exist_ok=True)
                  else:
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(z.read(item.filename))

          android = Path("mobile/android")
          if android.is_dir():
              shutil.rmtree(android)
          elif android.exists():
              android.unlink()

          assert Path("mobile/pubspec.yaml").is_file(), "mobile/pubspec.yaml topilmadi"
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          cd mobile
          flutter create . --platforms=android

      - name: Build APK
        run: |
          cd mobile
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartMaktab-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
